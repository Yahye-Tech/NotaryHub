name: NotaryHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notaryhub
          POSTGRES_PASSWORD: notaryhub_dev_2026
          POSTGRES_DB: notaryhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U notaryhub -d notaryhub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DATABASE_URL: postgresql://notaryhub:notaryhub_dev_2026@127.0.0.1:5432/notaryhub
      DATABASE_URL: postgresql://notaryhub:notaryhub_dev_2026@127.0.0.1:5432/notaryhub
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      TEST_SKIP_EMAIL_INIT: "true"
      TEST_SKIP_RATE_LIMIT: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build frontend and backend
        run: npm run build

      - name: Initialize PostgreSQL schema
        run: |
          set -euo pipefail
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema_tenants.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema_full.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema_appointments.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema_queue.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema_uploads.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema_permissions.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema_invoices.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f src/db/schema_platform_settings.sql

      - name: Run integration suites
        run: |
          set -euo pipefail
          for suite in \
            test_schema.sh \
            test_auth.sh \
            test_tenants.sh \
            test_documents.sh \
            test_queue.sh \
            test_notifications.sh \
            test_permissions.sh \
            test_invoices.sh \
            test_certificates.sh \
            test_platform_settings.sh; do
            echo "===== Running ${suite} ====="
            bash "${suite}"
          done
